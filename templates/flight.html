{% extends "base.html" %}
{% block content %}
<div class="grid grid-cols-10 h-screen overflow-hidden">
    <div class="col-span-7 bg-slate-100 flex flex-col items-center p-12 overflow-y-auto">
        <div class="bg-white rounded-t-full border-x-4 border-slate-300 w-80 p-12 shadow-inner">
            <div class="grid grid-cols-4 gap-4">
                {% for row in rows %}
                    {% for col in cols %}
                    {% set seat_id = row|string + col %}
                    <div class="seat-item w-12 h-12 bg-blue-600 rounded flex items-center justify-center text-white text-xs font-bold cursor-pointer hover:bg-green-500 transition-all active:scale-90"
                         data-id="{{ seat_id }}" 
                         data-price="{{ seat_price }}">
                        {{ seat_id }}
                    </div>
                    {% endfor %}
                {% endfor %}
            </div>
        </div>
    </div>

    <div class="col-span-3 bg-white border-l flex flex-col">
        <div class="p-8 border-b flex-grow">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-tighter mb-6 underline decoration-blue-500 underline-offset-4">Selection Details</h3>
            
            <div id="placeholder-text" class="py-20 text-center">
                <i class="fa-solid fa-plane-up text-slate-200 text-5xl mb-4"></i>
                <p class="text-slate-400 italic">Select a seat to view value</p>
            </div>

            <div id="selection-box" class="hidden animate-fade-in">
                <p class="text-5xl font-black text-slate-800 mb-2" id="disp-id"></p>
                <div class="flex justify-between py-2 border-b">
                    <span class="text-slate-500">Instant Cost:</span>
                    <span class="font-bold text-green-600" id="disp-price"></span>
                </div>
                <div class="flex justify-between py-2">
                    <span class="text-slate-500">Future Credit:</span>
                    <span class="font-bold text-blue-600" id="disp-credit"></span>
                </div>
                <button class="w-full bg-slate-900 text-white py-4 rounded-lg font-bold mt-8 hover:bg-black transition">Confirm Purchase</button>
            </div>
        </div>

        <div class="p-8 bg-purple-50 h-1/3">
            <h3 class="text-xs font-bold text-purple-400 uppercase mb-2">AI Analyst</h3>
            <div id="ai-response" class="text-sm text-purple-800 leading-relaxed font-medium italic">
                Waiting for selection...
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.seat-item').forEach(item => {
        item.addEventListener('click', () => {
            const id = item.getAttribute('data-id');
            const price = parseFloat(item.getAttribute('data-price'));
            
            document.getElementById('placeholder-text').classList.add('hidden');
            document.getElementById('selection-box').classList.remove('hidden');
            
            document.getElementById('disp-id').innerText = id;
            document.getElementById('disp-price').innerText = "$" + price;
            document.getElementById('disp-credit').innerText = "$" + (price * 1.25).toFixed(2);

            document.getElementById('ai-response').innerText = "Analyzing seat " + id + "...";
            
            fetch('/ask_ai', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ seat: id, cost: price })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('ai-response').innerText = data.answer;
            });
        });
    });
</script>
{% endblock %}
